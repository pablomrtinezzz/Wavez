name: Refresh marine data

# Downloads Open-Meteo data for every spot and publishes it as a single JSON
# file on the `data` branch, which the website reads. GitHub may delay
# scheduled runs by a few minutes under load; the site falls back to live
# Open-Meteo requests if the snapshot is older than 3 hours.
on:
  # Main trigger: cron-job.org calls the workflow_dispatch API every 15 min
  # (GitHub's own scheduler delays runs by hours). This hourly schedule is
  # only a backup in case the external cron stops.
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marine-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npx tsx scripts/refresh-marine-snapshot.ts out/marine-snapshot.json

      # The branch always holds a single commit, so the repository does not grow
      - name: Publish to the data branch
        # Skipped when the download was rate-limited (previous snapshot kept)
        if: hashFiles('out/marine-snapshot.json') != ''
        working-directory: out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Vercel reads vercel.json from the branch it would deploy, so the data
          # branch carries its own config disabling deployments
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marine-snapshot.json vercel.json
          git commit -q -m "data: marine snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
