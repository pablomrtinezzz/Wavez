name: Refresh marine data

# Publishes Open-Meteo data for every spot as a single JSON file on the
# `data` branch, which the website reads. Each run first checks one probe spot
# and only downloads every spot when a model has published new data (a few
# times a day); otherwise it re-publishes the same data marked as checked.
on:
  # Main trigger: cron-job.org calls the workflow_dispatch API every 15 min
  # (GitHub's own scheduler delays runs by hours). This hourly schedule is
  # only a backup in case the external cron stops.
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marine-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      # The script compares one probe spot against this copy and only downloads
      # every spot when Open-Meteo has published a new model run
      - name: Read the published snapshot
        run: git fetch -q --depth=1 origin data && git show FETCH_HEAD:marine-snapshot.json > previous-snapshot.json || echo "No published snapshot yet"

      - run: npx tsx scripts/refresh-marine-snapshot.ts out/marine-snapshot.json previous-snapshot.json

      # The branch always holds a single commit, so the repository does not grow
      - name: Publish to the data branch
        # Skipped when Open-Meteo could not be reached (previous snapshot kept)
        if: hashFiles('out/marine-snapshot.json') != ''
        working-directory: out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Vercel reads vercel.json from the branch it would deploy, so the data
          # branch carries its own config disabling deployments
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marine-snapshot.json vercel.json
          git commit -q -m "data: marine snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
