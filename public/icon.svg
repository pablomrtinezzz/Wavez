<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stopColor="#0B1C33" />
      <stop offset="100%" stopColor="#040912" />
    </radialGradient>
    <linearGradient id="wavezGrad" x1="60" y1="60" x2="450" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#06B6D4" />
      <stop offset="50%" stopColor="#3B82F6" />
      <stop offset="100%" stopColor="#10B981" />
    </linearGradient>
    <linearGradient id="crestGrad" x1="150" y1="150" x2="380" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="100%" stopColor="#67E8F9" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bgGrad)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="8" />

  <!-- Sonar Radar rings -->
  <circle cx="256" cy="256" r="170" stroke="rgba(255, 255, 255, 0.08)" stroke-width="4" stroke-dasharray="8 12" />
  <circle cx="256" cy="256" r="105" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4" stroke-dasharray="8 12" />

  <!-- Surf Wave Crest / W Shape -->
  <path
    d="M125 300 C160 300 180 230 215 210 C235 190 255 235 280 270 C300 300 335 170 390 180"
    stroke="url(#wavezGrad)"
    stroke-width="34"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Barrel / Tube Curl -->
  <path
    d="M300 180 C345 160 385 180 385 225 C385 270 345 280 310 260"
    stroke="url(#crestGrad)"
    stroke-width="24"
    stroke-linecap="round"
  />

  <!-- Target Radar Point -->
  <circle cx="215" cy="210" r="26" fill="#34D399" />
  <circle cx="215" cy="210" r="46" stroke="#34D399" stroke-width="6" opacity="0.4" />
</svg>
